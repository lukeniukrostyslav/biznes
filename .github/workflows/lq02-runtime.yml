name: LQ02 Runtime Boot

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: lq02-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lq02-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run LQ02 Runtime / Boot only
        run: npx playwright test e2e/lq02-runtime.spec.js

      - name: Upload LQ02 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lq02-runtime-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
