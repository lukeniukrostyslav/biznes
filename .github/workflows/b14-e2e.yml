name: B14 E2E

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser matrix
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run unit and static regression
        run: npm test

      - name: Run B14 E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b14-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
