name: Sequential Quality Gate

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: sequential-quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: B07.7 Invoice lifecycle
        run: npx playwright test e2e/app.spec.js --grep 'B07.7 invoice create/edit' --project=chromium --workers=1 --max-failures=1
