name: Sequential Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: sequential-quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers once
        run: npx playwright install --with-deps chromium firefox webkit

      - name: "1. Core Tests"
        run: npm test

      - name: "2. LQ02 Runtime Boot"
        run: npx playwright test e2e/lq02-runtime.spec.js --workers=1

      - name: "3. LQ04 CRUD Forms"
        run: npx playwright test e2e/lq04-crud.spec.js --workers=1

      - name: "4. LQ05 Localization"
        run: npx playwright test e2e/lq05-localization.spec.js --workers=1

      - name: "5A. Design Regression — Chromium"
        run: npx playwright test --project=chromium --workers=1 --max-failures=1

      - name: "5B. Design Regression — Firefox"
        run: npx playwright test --project=firefox --workers=1 --max-failures=1

      - name: "5C. Design Regression — WebKit"
        run: npx playwright test --project=webkit --workers=1 --max-failures=1

      - name: "6. B14 E2E — Chromium"
        run: npx playwright test --project=chromium --workers=1 --max-failures=1

      - name: "7. B14 E2E — Firefox"
        run: npx playwright test --project=firefox --workers=1 --max-failures=1

      - name: "8. B14 E2E — WebKit"
        run: npx playwright test --project=webkit --workers=1 --max-failures=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequential-quality-gate-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
