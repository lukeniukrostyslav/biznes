name: LQ04 CRUD Forms

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: lq04-crud-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lq04-crud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run LQ04 CRUD / Forms only
        run: npx playwright test e2e/lq04-crud.spec.js

      - name: Upload LQ04 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lq04-crud-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
