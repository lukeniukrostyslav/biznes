name: Core Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run core tests
        run: npm test
      - name: Install Playwright browsers
        run: npx -y playwright@1.55.0 install --with-deps chromium firefox webkit
      - name: Run browser E2E tests
        run: npx -y playwright@1.55.0 test
